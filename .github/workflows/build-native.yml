name: Build Native Apps

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL for mobile apps (Android/iOS).'
        required: true
        default: 'http://10.0.2.2:3000'
      build_type:
        description: 'Build type'
        required: true
        type: choice
        default: 'release'
        options:
          - release
          - debug

jobs:
  desktop:
    name: Desktop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            artifact: masomo-windows
            build_cmd: --win
          - os: macos-latest
            label: macos
            artifact: masomo-macos
            build_cmd: --mac
          - os: ubuntu-latest
            label: linux
            artifact: masomo-linux
            build_cmd: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install JS dependencies (NPM)
        run: npm install --legacy-peer-deps
      - name: Build Electron app
        run: npx electron-builder --config electron-builder.yml ${{ matrix.build_cmd }}
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: electron/dist/*
          retention-days: 30
          if-no-files-found: warn

  android:
    # (Reste inchangé)
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install JS dependencies
        run: bun install --no-frozen-lockfile
      - name: Build
        run: bunx cap sync android && cd android && ./gradlew assembleRelease

  ios:
    # (Reste inchangé)
    name: iOS (.ipa unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install JS dependencies
        run: bun install --no-frozen-lockfile
      - name: Build
        run: bunx cap sync ios && xcodebuild ...
