name: Build Native Apps

# ============================================================================
# Build MASOMO native installers for all platforms WITHOUT Tauri:
#   - Windows: .exe (NSIS installer) + portable .exe   — via Electron
#   - macOS:   .dmg (x64 + arm64)                      — via Electron
#   - Linux:   .deb + .AppImage                        — via Electron
#   - Android: .apk (debug + release)                  — via Capacitor
#   - iOS:     .ipa (unsigned)                         — via Capacitor
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL for mobile apps (Android/iOS). Use http://10.0.2.2:3000 for Android emulator, http://localhost:3000 for iOS simulator, or https://your-server.com for production'
        required: true
        default: 'http://10.0.2.2:3000'
      build_type:
        description: 'Build type (debug is faster, release is for distribution)'
        required: true
        type: choice
        default: 'release'
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  # ==========================================================================
  # DESKTOP BUILDS (Windows / macOS / Linux) — via Electron + electron-builder
  # ==========================================================================
  desktop:
    name: Desktop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            artifact: masomo-windows
            build_cmd: --win
          - os: macos-latest
            label: macos
            artifact: masomo-macos
            build_cmd: --mac
          - os: ubuntu-latest
            label: linux
            artifact: masomo-linux
            build_cmd: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies (Electron runtime libs)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3-dev \
            libxss1-dev \
            libxtst-dev \
            xauth \
            xvfb \
            libgbm-dev \
            libasound2-dev \
            libatk-bridge2.0-dev \
            libatk1.0-dev \
            libcups2-dev \
            libdrm-dev \
            libxkbcommon-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libxrandr-dev

      - name: Install JS dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Push Prisma schema (Create SQLite DB before build)
        run: bunx prisma db push

      - name: Build Next.js (standalone)
        run: bun run build

      - name: Prepare Electron resources (bundle server + node binary + db)
        run: node scripts/prepare-electron-resources.mjs

      - name: Verify clean app directory (no node_modules = no rebuild)
        shell: bash
        run: |
          echo "=== electron/app/ contents ==="
          ls -la electron/app/
          echo ""
          echo "=== electron/app/package.json ==="
          cat electron/app/package.json
          echo ""
          if [ -d electron/app/node_modules ]; then
            echo "WARNING: node_modules exists in app dir!"
          else
            echo "OK: No node_modules in app dir."
          fi

      - name: Build Electron app
        run: bunx electron-builder --config electron-builder.yml ${{ matrix.build_cmd }}
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            electron/dist/*.exe
            electron/dist/*.dmg
            electron/dist/*.deb
            electron/dist/*.AppImage
            electron/dist/*.snap
            electron/dist/*.yml
            electron/dist/latest*.yml
          retention-days: 30
          if-no-files-found: warn

  # ==========================================================================
  # ANDROID BUILD — via Capacitor
  # ==========================================================================
  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: Install JS dependencies
        run: bun install

      - name: Install Capacitor Android
        run: bun add @capacitor/android@^6

      - name: Update Capacitor server URL
        run: |
          SERVER_URL="${{ github.event.inputs.server_url }}"
          sed -i "s|url: 'http://localhost:3000'|url: '${SERVER_URL}'|" capacitor.config.ts
          echo "Updated capacitor.config.ts:"
          cat capacitor.config.ts

      - name: Create web assets directory
        run: |
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body></body></html>' > out/index.html

      - name: Add Android platform
        run: bunx cap add android || true

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Build debug APK
        if: github.event.inputs.build_type == 'debug'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        if: github.event.inputs.build_type == 'release'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masomo-android
          path: |
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn

  # ==========================================================================
  # iOS BUILD — via Capacitor
  # ==========================================================================
  ios:
    name: iOS (.ipa unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: bun install

      - name: Install Capacitor iOS
        run: bun add @capacitor/ios@^6

      - name: Update Capacitor server URL
        run: |
          SERVER_URL="${{ github.event.inputs.server_url }}"
          sed -i "s|url: 'http://localhost:3000'|url: '${SERVER_URL}'|" capacitor.config.ts

      - name: Create web assets directory
        run: |
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body></body></html>' > out/index.html

      - name: Add iOS platform
        run: bunx cap add ios || true

      - name: Sync Capacitor
        run: bunx cap sync ios

      - name: Build iOS Xcode Project
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphoneos CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p ios/build/Payload
          cp -r ios/App/DerivedData/App/Build/Products/Debug-iphoneos/App.app ios/build/Payload/
          cd ios/build && zip -r masomo-ios-unsigned.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: masomo-ios
          path: ios/build/masomo-ios-unsigned.ipa
          retention-days: 30
