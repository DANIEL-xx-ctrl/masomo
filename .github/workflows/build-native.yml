name: Build & Release MASOMO Desktop Application

on:
  push:
    tags:
      - 'v*' # S'exécute quand tu crées un tag (ex: v1.0.0)
  workflow_dispatch: # Permet aussi de lancer la compilation manuellement depuis GitHub

jobs:
  build:
    runs-on: windows-latest # Machine de compilation Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/checkout@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & DB
        run: |
          npx prisma generate
          npx prisma db push

      - name: Build Next.js standalone & Prepare Electron bundle
        run: npm run build # S'assurer que ce script prépare la build standalone et copie dans electron/resources

      - name: Build & Package Electron App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --config electron-builder.yml --win

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MASOMO-Windows-Installer
          path: electron/dist/*.exe
