name: Build Native Apps

# ============================================================================
# Build MASOMO native installers for all platforms:
#   - Windows: .exe (NSIS) + .msi (WiX) — via Tauri (bundled Node.js server)
#   - macOS:   .dmg + .pkg               — via Tauri (bundled Node.js server)
#   - Linux:   .deb + .AppImage          — via Tauri (bundled Node.js server)
#   - Android: .apk                       — via Capacitor (connects to remote URL)
#   - iOS:     .ipa (unsigned)            — via Capacitor (connects to remote URL)
#
# DESKTOP (Windows/macOS/Linux): The app bundles a Node.js binary + Next.js
#   standalone server. On launch, Tauri spawns `node server.js` on
#   127.0.0.1:3000 and loads it in the webview. NO system Node.js needed.
#
# MOBILE (Android/iOS): The app connects to a REMOTE server URL (provided
#   via the server_url input). Mobile OSes cannot spawn child processes,
#   so a local server is not possible.
#
# Usage:
#   1. Push this project to GitHub
#   2. Go to the "Actions" tab of your repository
#   3. Select "Build Native Apps" workflow
#   4. Click "Run workflow" → choose the server URL → Run
#   5. When builds finish, download the artifacts (.exe, .pkg, .deb, .apk, .ipa)
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL for mobile apps (Android/iOS). Use http://10.0.2.2:3000 for Android emulator, http://localhost:3000 for iOS simulator, or https://your-server.com for production'
        required: true
        default: 'http://10.0.2.2:3000'
      build_type:
        description: 'Build type (debug is faster, release is for distribution)'
        required: true
        type: choice
        default: 'release'
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  # ==========================================================================
  # DESKTOP BUILDS (Windows / macOS / Linux) — via Tauri
  # Bundles Node.js binary so the local server runs on 127.0.0.1
  # ==========================================================================
  desktop:
    name: Desktop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            artifact: masomo-windows
          - os: macos-latest
            label: macos
            artifact: masomo-macos
          - os: ubuntu-latest
            label: linux
            artifact: masomo-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Prepare Tauri resources (build Next.js + copy server + bundle Node.js)
        run: node scripts/prepare-tauri-resources.mjs

      - name: Verify bundled Node.js binary
        shell: bash
        run: |
          echo "=== Checking bundled Node binary ==="
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ls -la src-tauri/resources/server/node-bin/node.exe || echo "MISSING node.exe"
          else
            ls -la src-tauri/resources/server/node-bin/node || echo "MISSING node"
            chmod +x src-tauri/resources/server/node-bin/node 2>/dev/null || true
          fi

      - name: Verify placeholder index.html exists (Tauri frontendDist)
        shell: bash
        run: |
          echo "=== Checking placeholder/index.html ==="
          if [ ! -f src-tauri/resources/placeholder/index.html ]; then
            echo "✗ MISSING: src-tauri/resources/placeholder/index.html"
            echo "  Tauri build will fail. Creating it now..."
            mkdir -p src-tauri/resources/placeholder
            cat > src-tauri/resources/placeholder/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="fr"><head><meta charset="UTF-8"><title>MASOMO</title></head>
          <body style="background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif">
          <div style="text-align:center"><h1 style="color:#10b981;font-size:3rem">MASOMO</h1><p>Démarrage...</p></div>
          </body></html>
          HTMLEOF
            echo "✓ Created placeholder/index.html"
          else
            echo "✓ placeholder/index.html exists ($(wc -c < src-tauri/resources/placeholder/index.html) bytes)"
          fi

      - name: Remove root Cargo.toml if exists (causes 'No package info' error)
        shell: bash
        run: |
          echo "=== Checking for root Cargo.toml (MUST NOT EXIST) ==="
          if [ -f Cargo.toml ]; then
            echo "✗ FOUND root Cargo.toml — this causes 'No package info in the config file'"
            echo "  Content:"
            cat Cargo.toml
            echo "  Deleting it now..."
            rm -f Cargo.toml
            echo "✓ Deleted root Cargo.toml"
          else
            echo "✓ No root Cargo.toml (correct)"
          fi
          echo ""
          echo "=== Verifying src-tauri/Cargo.toml has [package] section ==="
          if [ -f src-tauri/Cargo.toml ]; then
            head -5 src-tauri/Cargo.toml
            if grep -q "\[package\]" src-tauri/Cargo.toml; then
              echo "✓ src-tauri/Cargo.toml has [package] section"
            else
              echo "✗ ERROR: src-tauri/Cargo.toml missing [package] section!"
              exit 1
            fi
          else
            echo "✗ ERROR: src-tauri/Cargo.toml not found!"
            exit 1
          fi

      - name: Build Tauri app
        run: bunx tauri build
        env:
          CI: true
          # Prevent beforeBuildCommand from re-running prepare-tauri-resources.mjs
          # (we already ran it above, so skip it to save time)
          TAURI_SKIP_BEFORE_BUILD_COMMAND: 'true'

      - name: Create .pkg installer (macOS only)
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        run: |
          productbuild --component \
            src-tauri/target/release/bundle/macos/MASOMO.app \
            /Applications \
            MASOMO.pkg

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/
            *.pkg
          retention-days: 30
          if-no-files-found: warn

  # ==========================================================================
  # ANDROID BUILD — via Capacitor (connects to remote server URL)
  # ==========================================================================
  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: Install JS dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Install Capacitor Android
        run: bun add @capacitor/android@^6

      - name: Update Capacitor server URL
        run: |
          SERVER_URL="${{ github.event.inputs.server_url }}"
          sed -i "s|url: 'http://localhost:3000'|url: '${SERVER_URL}'|" capacitor.config.ts
          echo "Updated capacitor.config.ts:"
          cat capacitor.config.ts

      - name: Create web assets directory
        run: |
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body></body></html>' > out/index.html

      - name: Add Android platform
        run: bunx cap add android || true

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Build debug APK
        if: github.event.inputs.build_type == 'debug'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (unsigned if no keystore secret)
        if: github.event.inputs.build_type == 'release'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masomo-android
          path: |
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn

  # ==========================================================================
  # iOS BUILD — via Capacitor (connects to remote server URL)
  #
  # Produces an unsigned .ipa. To install on a physical device you must:
  #   1. Have an Apple Developer account ($99/year)
  #   2. Set these repository secrets:
  #      - IOS_P12_BASE64       (signing certificate, base64-encoded)
  #      - IOS_P12_PASSWORD     (certificate password)
  #      - IOS_PROVISIONING_PROFILE_BASE64 (provisioning profile, base64)
  #      - IOS_TEAM_ID          (Apple Developer Team ID, e.g. ABCD1234EF)
  #   3. Re-run the workflow — the signing step will activate automatically.
  #
  # Without signing secrets, the .ipa is still produced but can only be
  # installed via sideloading tools (AltStore, Sideloadly) or run in the
  # iOS Simulator (use server_url = http://localhost:3000).
  # ==========================================================================
  ios:
    name: iOS (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JS dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Install Capacitor iOS
        run: bun add @capacitor/ios@^6

      - name: Update Capacitor server URL
        run: |
          SERVER_URL="${{ github.event.inputs.server_url }}"
          # macOS sed needs -i '' (empty string for no backup)
          sed -i '' "s|url: 'http://localhost:3000'|url: '${SERVER_URL}'|" capacitor.config.ts
          echo "Updated capacitor.config.ts:"
          cat capacitor.config.ts

      - name: Create web assets directory
        run: |
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body></body></html>' > out/index.html

      - name: Add iOS platform
        run: bunx cap add ios || true

      - name: Sync Capacitor
        run: bunx cap sync ios

      # ---- Code signing (only if secrets are set) ----
      - name: Import signing certificate
        if: env.IOS_P12_BASE64 != ''
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$IOS_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Install provisioning profile
        if: env.IOS_PROVISIONING_PROFILE_BASE64 != ''
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/masomo.mobileprovision

      - name: Build iOS app (archive)
        working-directory: ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$IOS_TEAM_ID" ]; then
            echo "Building with signing (Team ID: $IOS_TEAM_ID)"
            pod install --repo-update || true
            xcodebuild -workspace App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/App.xcarchive \
              -destination "generic/platform=iOS" \
              DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              archive
          else
            echo "Building WITHOUT signing (unsigned archive for simulator/sideload)"
            pod install --repo-update || true
            xcodebuild -workspace App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/App.xcarchive \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive
          fi

      - name: Export IPA
        working-directory: ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r -q MASOMO.ipa Payload
          echo "=== IPA created ==="
          ls -lh MASOMO.ipa

      - name: Upload IPA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masomo-ios
          path: |
            ios/build/*.ipa
            ios/build/App.xcarchive
          retention-days: 30
          if-no-files-found: warn
