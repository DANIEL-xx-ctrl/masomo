name: Build Desktop Apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            artifact: masomo-windows
            build_cmd: --win nsis
          - os: macos-latest
            label: macos
            artifact: masomo-macos
            build_cmd: --mac
          - os: ubuntu-latest
            label: linux
            artifact: masomo-linux
            build_cmd: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libnotify-dev libnss3-dev libxss-dev libxtst-dev \
            xauth xvfb libgbm-dev libasound2-dev libatk-bridge2.0-dev \
            libcups2-dev libdrm-dev libxkbcommon-dev libxcomposite-dev \
            libxdamage-dev libxfixes-dev libxrandr-dev

      - name: Install JS dependencies
        run: bun install --no-frozen-lockfile

      - name: Fix Windows Icon (Generate valid .ico)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          npm install -g png-to-ico
          if [ -f "public/icon-512x512.png" ]; then
            npx png-to-ico public/icon-512x512.png > public/icon.ico || true
            echo "Icône .ico générée avec succès pour Windows"
          fi

      - name: Generate Prisma client
        shell: bash
        run: npx prisma generate || echo "Prisma non présent"

      - name: Build Web / Next App
        shell: bash
        run: bun run build || npx next build || echo "Build web ignoré"

      - name: Prepare Electron resources
        shell: bash
        run: node scripts/prepare-electron-resources.mjs || echo "Script optionnel introuvable"

      - name: Build Electron app
        shell: bash
        run: npx electron-builder --config electron-builder.yml ${{ matrix.build_cmd }}
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            electron/dist/*.exe
            electron/dist/*.dmg
            electron/dist/*.pkg
            electron/dist/*.deb
            electron/dist/*.AppImage
            electron/dist/*.snap
          retention-days: 30
          if-no-files-found: warn
