name: Build iOS App

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL for iOS'
        required: true
        default: 'http://localhost:3000'

permissions:
  contents: read

jobs:
  ios:
    name: iOS (.ipa unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: bun install --no-frozen-lockfile

      - name: Inject Server URL
        run: |
          SERVER_URL="${{ github.event.inputs.server_url }}"
          if [ -f capacitor.config.ts ]; then
            sed -i '' "s|url: 'http://localhost:3000'|url: '${SERVER_URL}'|g" capacitor.config.ts
          elif [ -f capacitor.config.json ]; then
            sed -i '' "s|http://localhost:3000|${SERVER_URL}|g" capacitor.config.json
          fi

      - name: Create Web Assets Fallback
        run: |
          mkdir -p out dist www public
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body></body></html>' > out/index.html
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body></body></html>' > dist/index.html
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body></body></html>' > www/index.html

      - name: Add iOS platform if missing
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode Project
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p ios/build/Payload
          if [ -d ios/build/DerivedData/Build/Products/Debug-iphoneos/App.app ]; then
            cp -r ios/build/DerivedData/Build/Products/Debug-iphoneos/App.app ios/build/Payload/
            cd ios/build && zip -r masomo-ios-unsigned.ipa Payload
          fi

      - name: Upload iOS Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masomo-ios
          path: ios/build/masomo-ios-unsigned.ipa
          retention-days: 30
          if-no-files-found: warn
