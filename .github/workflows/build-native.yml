name: Build Native Apps

# ============================================================================
# Build MASOMO native installers for all platforms WITHOUT Tauri:
#   - Windows: .exe (NSIS installer) + portable .exe   — via Electron
#   - macOS:   .dmg (x64 + arm64)                      — via Electron
#   - Linux:   .deb + .AppImage                        — via Electron
#   - Android: .apk (debug + release)                  — via Capacitor
#   - iOS:     .ipa (unsigned)                         — via Capacitor
#
# Usage:
#   1. Push this project to GitHub
#   2. Go to the "Actions" tab of your repository
#   3. Select "Build Native Apps" workflow
#   4. Click "Run workflow" → choose the server URL → Run
#   5. When builds finish, download the artifacts (.exe, .dmg, .deb, .apk, .ipa)
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL for mobile apps (Android/iOS). Use http://10.0.2.2:3000 for Android emulator, http://localhost:3000 for iOS simulator, or https://your-server.com for production'
        required: true
        default: 'http://10.0.2.2:3000'
      build_type:
        description: 'Build type (debug is faster, release is for distribution)'
        required: true
        type: choice
        default: 'release'
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  # ==========================================================================
  # DESKTOP BUILDS (Windows / macOS / Linux) — via Electron + electron-builder
  # ==========================================================================
  desktop:
    name: Desktop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            artifact: masomo-windows
            build_cmd: --win
          - os: macos-latest
            label: macos
            artifact: masomo-macos
            build_cmd: --mac
          - os: ubuntu-latest
            label: linux
            artifact: masomo-linux
            build_cmd: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies (Electron native deps)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3-dev \
            libxss1-dev \
            libxtst-dev \
            xauth \
            xvfb \
            libgbm-dev \
            libasound2-dev \
            libatk-bridge2.0-dev \
            libatk1.0-dev \
            libcups2-dev \
            libdrm-dev \
            libxkbcommon-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libxrandr-dev

      - name: Install JS dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build Next.js (standalone)
        run: bun run build

      - name: Prepare Electron resources (bundle server + node binary + db)
        run: node scripts/prepare-electron-resources.mjs

      - name: Remove native modules unused by Electron main process
        # The Electron main process (electron/main.js) only uses Node.js
        # built-in modules (electron, child_process, path, net, http, fs).
        # It does NOT need @parcel/watcher, sharp, or any native dependency.
        # Removing them prevents @electron/rebuild from trying to recompile
        # them (which fails on Windows without Visual Studio Build Tools).
        shell: bash
        run: |
          rm -rf node_modules/@parcel/watcher node_modules/@parcel/watcher-win32-x64 || true
          rm -rf node_modules/sharp node_modules/@img || true
          rm -rf node_modules/better-sqlite3 || true
          rm -rf node_modules/cpu-features || true
          echo "Remaining native modules:"
          find node_modules -name "*.node" -type f 2>/dev/null | head -20 || true

      - name: Build Electron app (npmRebuild disabled via CLI override)
        # --config.npmRebuild=false OVERRIDES whatever is in electron-builder.yml
        # This is the bulletproof way to skip @electron/rebuild on all platforms.
        run: bunx electron-builder --config electron-builder.yml ${{ matrix.build_cmd }} --config.npmRebuild=false --config.nodeGypRebuild=false
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_runtime: electron
          npm_config_target: 33.4.11

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            electron/dist/*.exe
            electron/dist/*.dmg
            electron/dist/*.deb
            electron/dist/*.AppImage
            electron/dist/*.snap
            electron/dist/*.yml
            electron/dist/latest*.yml
          retention-days: 30
          if-no-files-found: warn

  # ==========================================================================
  # ANDROID BUILD — via Capacitor
  # ==========================================================================
  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: Install JS dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Install Capacitor Android
        run: bun add @capacitor/android@^6

      - name: Update Capacitor server URL
        run: |
          SERVER_URL="${{ github.event.inputs.server_url }}"
          sed -i "s|url: 'http://localhost:3000'|url: '${SERVER_URL}'|" capacitor.config.ts
          echo "Updated capacitor.config.ts:"
          cat capacitor.config.ts

      - name: Create web assets directory
        run: |
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body></body></html>' > out/index.html

      - name: Add Android platform
        run: bunx cap add android || true

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Build debug APK
        if: github.event.inputs.build_type == 'debug'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (unsigned if no keystore secret)
        if: github.event.inputs.build_type == 'release'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masomo-android
          path: |
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn

  # ==========================================================================
  # iOS BUILD — via Capacitor
  #
  # Produces an unsigned .ipa. To install on a physical device you must:
  #   1. Have an Apple Developer account ($99/year)
  #   2. Set these repository secrets:
  #      - IOS_P12_BASE64, IOS_P12_PASSWORD
  #      - IOS_PROVISIONING_PROFILE_BASE64, IOS_TEAM_ID
  #   3. Re-run the workflow — signing activates automatically.
  #
  # Without signing secrets, the .ipa can only be installed via sideloading
  # tools (AltStore, Sideloadly) or run in the iOS Simulator.
  # ==========================================================================
  ios:
    name: iOS (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JS dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Install Capacitor iOS
        run: bun add @capacitor/ios@^6

      - name: Update Capacitor server URL
        run: |
          SERVER_URL="${{ github.event.inputs.server_url }}"
          sed -i '' "s|url: 'http://localhost:3000'|url: '${SERVER_URL}'|" capacitor.config.ts
          echo "Updated capacitor.config.ts:"
          cat capacitor.config.ts

      - name: Create web assets directory
        run: |
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body></body></html>' > out/index.html

      - name: Add iOS platform
        run: bunx cap add ios || true

      - name: Sync Capacitor
        run: bunx cap sync ios

      - name: Import signing certificate
        if: env.IOS_P12_BASE64 != ''
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$IOS_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Install provisioning profile
        if: env.IOS_PROVISIONING_PROFILE_BASE64 != ''
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/masomo.mobileprovision

      - name: Build iOS app (archive)
        working-directory: ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$IOS_TEAM_ID" ]; then
            echo "Building with signing (Team ID: $IOS_TEAM_ID)"
            pod install --repo-update || true
            xcodebuild -workspace App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/App.xcarchive \
              -destination "generic/platform=iOS" \
              DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              archive
          else
            echo "Building WITHOUT signing (unsigned archive for simulator/sideload)"
            pod install --repo-update || true
            xcodebuild -workspace App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/App.xcarchive \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive
          fi

      - name: Export IPA
        working-directory: ios
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r -q MASOMO.ipa Payload
          echo "=== IPA created ==="
          ls -lh MASOMO.ipa

      - name: Upload IPA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masomo-ios
          path: |
            ios/build/*.ipa
            ios/build/App.xcarchive
          retention-days: 30
          if-no-files-found: warn
