name: Build Android App

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL for Android'
        required: true
        default: 'http://10.0.2.2:3000'
      build_type:
        description: 'Build type'
        required: true
        type: choice
        default: 'release'
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: bun install --no-frozen-lockfile

      - name: Inject Server URL
        run: |
          SERVER_URL="${{ github.event.inputs.server_url }}"
          if [ -f capacitor.config.ts ]; then
            sed -i "s|url: 'http://localhost:3000'|url: '${SERVER_URL}'|g" capacitor.config.ts
          elif [ -f capacitor.config.json ]; then
            sed -i "s|http://localhost:3000|${SERVER_URL}|g" capacitor.config.json
          fi

      - name: Create Web Assets Fallback
        run: |
          mkdir -p out dist www public
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body></body></html>' > out/index.html
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body></body></html>' > dist/index.html
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body></body></html>' > www/index.html

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Gradlew Executable Permissions
        run: chmod +x android/gradlew

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'debug'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masomo-android
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
