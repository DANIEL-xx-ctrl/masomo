# ============================================================================
# electron-builder configuration for MASOMO
# ============================================================================

appId: com.masomo.app
productName: MASOMO
copyright: Copyright © 2024 MASOMO

electronVersion: 33.4.11

directories:
  app: electron/app
  output: electron/dist
  buildResources: electron/build

npmRebuild: false
buildDependenciesFromSource: false
nodeGypRebuild: false

files:
  - main.js
  - preload.js
  - package.json

# Extra resources: Serveur Next.js standalone + Template SQLite
extraResources:
  - from: electron/resources/server
    to: server
    filter: ["**/*"]
  - from: prisma/dev.sqlite
    to: prisma/dev.sqlite

# Windows NSIS installer + portable exe
win:
  icon: public/icons/icon-72x72.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: MASOMO-${version}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MASOMO
  installerIcon: public/icons/icon-72x72.ico
  uninstallerIcon: public/icons/icon-72x72.ico

# macOS DMG (x64 + arm64)
mac:
  icon: public/icon-512x512.png
  category: public.app-category.education
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: MASOMO-${version}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: null
  entitlementsInherit: null

dmg:
  title: MASOMO ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Linux deb + AppImage
linux:
  icon: public/icon-512x512.png
  category: Education
  target:
    - target: deb
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
  maintainer: MASOMO
  vendor: MASOMO
  synopsis: Système de Gestion Scolaire
  description: MASOMO — Système de Gestion Scolaire complet (élèves, enseignants, notes, bulletins, paiements)

deb:
  priority: optional
  compression: gz

publish: null
