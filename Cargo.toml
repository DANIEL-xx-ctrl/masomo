# ============================================================================
# Root Cargo manifest
#
# This file MUST exist at the project root. Tauri v2 requires:
#   1. A Cargo.toml at the root (for its file watcher / cargo metadata)
#   2. A [package] section (otherwise: "No package info in the config file")
#   3. At least one target (otherwise: "no targets specified in the manifest")
#
# This package has a dummy [[bin]] target (src/main.rs with `fn main() {}`)
# that is NEVER compiled into the final app. The actual MASOMO application
# lives in src-tauri/ and is built via `cargo build` in that subdirectory.
# ============================================================================
[package]
name = "masomo-workspace"
version = "0.1.0"
edition = "2021"
publish = false

# Explicitly declare a dummy binary target so Cargo accepts this manifest.
# Without this, Cargo errors: "no targets specified in the manifest".
[[bin]]
name = "masomo-dummy"
path = "src/main.rs"

[workspace]
members = ["src-tauri"]
resolver = "2"
